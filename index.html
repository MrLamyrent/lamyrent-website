<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lamyrent</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:"JetBrains Mono",monospace;
overflow-x:hidden;
background:#001100;
color:#00ff88;
text-shadow:0 0 6px #00ff88;
}

/* CURSOR GLOW */
.cursor-glow{
position:fixed;
width:300px;
height:300px;
border-radius:50%;
pointer-events:none;
background:radial-gradient(circle,#00ff8855,transparent 70%);
transform:translate(-50%,-50%);
z-index:-1;
}

/* CRT */
body::after{
content:"";
position:fixed;
width:100%;
height:100%;
pointer-events:none;
background:repeating-linear-gradient(
to bottom,
transparent 0px,
transparent 2px,
rgba(0,0,0,.25) 3px
);
animation:flicker .15s infinite;
}

@keyframes flicker{
0%{opacity:.96;}
50%{opacity:1;}
100%{opacity:.95;}
}

canvas{
position:fixed;
top:0;
left:0;
z-index:-2;
}

/* BOOT */
#boot{
position:fixed;
width:100%;
height:100%;
background:black;
color:#00ff88;
padding:40px;
font-size:14px;
z-index:9999;
}

/* MAIN */
.wrapper{
display:flex;
justify-content:center;
padding:60px 20px;
}

.card{
width:760px;
background:rgba(0,20,0,.85);
border:1px solid #00ff88;
border-radius:18px;
padding:40px;
box-shadow:0 0 40px rgba(0,0,0,.8);
}

.header{
display:flex;
align-items:center;
gap:25px;
}

.avatar{
width:110px;
border-radius:50%;
border:3px solid #00ff88;
}

.section{margin-top:35px;}

.links a{
display:inline-block;
margin:5px;
padding:10px 14px;
text-decoration:none;
color:#00ff88;
background:#002200;
border-radius:8px;
}

.links a:hover{
background:#003300;
box-shadow:0 0 12px #00ff88;
}

.plugin-wrapper{
display:flex;
align-items:center;
gap:20px;
}

.plugin-avatar{
width:90px;
border-radius:14px;
border:2px solid #00ff88;
}

.mod-card{
background:#002200;
padding:15px;
border-radius:12px;
}

.glitch{font-weight:600;}

</style>
</head>

<body>

<div class="cursor-glow" id="glow"></div>

<canvas id="matrix"></canvas>

<div id="boot">
<div id="boot-text"></div>
</div>

<div class="wrapper">
<div class="card">

<div class="header">
<img id="discord-avatar" class="avatar" src="assets/avatar.png">

<div>
<h1 id="typing" class="glitch">Lamyrent</h1>
<div id="activity">Loading activity...</div>
</div>
</div>

<div class="section">
<h2>About Me</h2>
<p>I'm Lamyrent — a developer focused on Minecraft plugins.</p>
</div>

<div class="section links">

<!-- ВСТАВЬ СВОИ ССЫЛКИ -->
<a href="https://github.com/MrLamyrent" target="_blank">GitHub</a>
<a href="PASTE_DISCORD_LINK">Discord</a>
<a href="PASTE_TELEGRAM_LINK">Telegram</a>
<a href="PASTE_STEAM_LINK">Steam</a>

</div>

<div class="section">
<h2>My Plugin</h2>

<div class="plugin-wrapper">
<img src="assets/avatar-paper.png" class="plugin-avatar">
<div id="modrinth" class="mod-card">loading...</div>
</div>

</div>

<div class="section">
<h2>Visitors</h2>
<p id="visits">loading...</p>
</div>

</div>
</div>

<script>

/* CURSOR GLOW */
const glow=document.getElementById("glow");
document.addEventListener("mousemove",e=>{
glow.style.left=e.clientX+"px";
glow.style.top=e.clientY+"px";
});

/* BOOT */
const bootText=document.getElementById("boot-text");
const bootLines=[
"booting kernel...",
"loading modules...",
"connecting discord api...",
"starting lamyrent.sys",
"access granted."
];

let b=0;
(function boot(){
if(b<bootLines.length){
bootText.innerHTML+=bootLines[b++]+"<br>";
setTimeout(boot,500);
}else{
setTimeout(()=>document.getElementById("boot").style.display="none",800);
}
})();

/* MATRIX */
const canvas=document.getElementById("matrix");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=innerWidth;
canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

const letters="01";
const fontSize=14;
let drops=[];

function reset(){
drops=[];
for(let i=0;i<canvas.width/fontSize;i++)drops[i]=1;
}
reset();

setInterval(()=>{
ctx.fillStyle="rgba(0,0,0,0.05)";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="#0f0";
ctx.font=fontSize+"px monospace";

drops.forEach((y,i)=>{
const text=letters[Math.floor(Math.random()*2)];
ctx.fillText(text,i*fontSize,y*fontSize);
if(y*fontSize>canvas.height&&Math.random()>0.975)drops[i]=0;
drops[i]++;
});
},33);

/* DISCORD ACTIVITY */
fetch("https://api.lanyard.rest/v1/users/986947762132254732")
.then(r=>r.json())
.then(({data:d})=>{
const avatar=document.getElementById("discord-avatar");
avatar.src=`https://cdn.discordapp.com/avatars/${d.discord_user.id}/${d.discord_user.avatar}.png`;

const act=document.getElementById("activity");

if(d.listening_to_spotify){
act.innerText=`Listening: ${d.spotify.song}`;
}else if(d.activities.length>0){
act.innerText=d.activities[0].name;
}else{
act.innerText="Idle";
}
});

/* VISITS */
fetch("https://visitors.lamyrent.workers.dev")
.then(r=>r.json())
.then(data=>{
document.getElementById("visits").innerText=data.visits+" visits";
});

/* MODRINTH */
fetch("https://api.modrinth.com/v2/project/witherss")
.then(r=>r.json())
.then(mod=>{
document.getElementById("modrinth").innerHTML=`
<h3>${mod.title}</h3>
<p>${mod.description}</p>
<a href="https://modrinth.com/mod/${mod.slug}" target="_blank">Open →</a>
`;
});

</script>

</body>
</html>

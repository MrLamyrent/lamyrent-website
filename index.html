<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lamyrent</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>

/* RESET */

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:"JetBrains Mono",monospace;
overflow-x:hidden;
background:#001100;
color:#00ff88;
text-shadow:0 0 6px #00ff88;
}

/* CRT */

body::after{
content:"";
position:fixed;
width:100%;
height:100%;
pointer-events:none;
background:repeating-linear-gradient(
to bottom,
transparent 0px,
transparent 2px,
rgba(0,0,0,.25) 3px
);
animation:flicker .15s infinite;
}

@keyframes flicker{
0%{opacity:.96;}
50%{opacity:1;}
100%{opacity:.95;}
}

/* MATRIX */

canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

/* BOOT */

#boot{
position:fixed;
width:100%;
height:100%;
background:black;
color:#00ff88;
padding:40px;
font-size:14px;
z-index:9999;
}

/* MAIN */

.wrapper{
display:flex;
justify-content:center;
padding:60px 20px;
}

.card{
width:760px;
background:rgba(0,20,0,.85);
border:1px solid #00ff88;
border-radius:18px;
padding:40px;
box-shadow:0 0 40px rgba(0,0,0,.8);
transition:.4s;
}

/* FOCUS GLOW EFFECT */

.card{
width:760px;
background:rgba(0,20,0,.85);
border:1px solid #00ff88;
border-radius:18px;
padding:40px;
box-shadow:0 0 40px rgba(0,0,0,.8);
transition:.4s;

/* новый эффект */
opacity:.85;
}

/* hover состояние */

.card:hover{
opacity:1;
transform:scale(1.02);
box-shadow:0 0 80px rgba(0,255,136,0.35);
}

/* SECTIONS */

.section{margin-top:35px;}

.section h2{
margin-bottom:12px;
color:#88ffcc;
font-size:15px;
}

/* AVATAR */

#discord-box{
position:relative;
display:inline-block;
}

.avatar{
width:110px;
border-radius:50%;
margin-bottom:15px;
border:3px solid #00ff88;
transition:.3s;
}

/* STATUS DOT */

#status-dot{
position:absolute;
bottom:2px;
right:2px;
width:22px;
height:22px;
border-radius:50%;
border:3px solid #001100;
}

.online{background:#43b581;}
.offline{background:#747f8d;}
.idle{background:#faa61a;}
.dnd{background:#f04747;}

/* LINKS HOVER */

.links a{
display:inline-block;
margin:5px;
padding:10px 14px;
text-decoration:none;
color:#00ff88;
background:#002200;
border-radius:8px;
transition:.25s;
}

.links a:hover{
transform:translateY(-3px) scale(1.05);
background:#003300;
box-shadow:0 0 12px #00ff88;
}

/* GLITCH */

.glitch{
position:relative;
font-weight:600;
}

.glitch::before,
.glitch::after{
content:attr(data-text);
position:absolute;
left:0;
width:100%;
}

.glitch::before{
color:#ff00c8;
z-index:-1;
animation:glitchTop 2s infinite linear;
}

.glitch::after{
color:#00fff9;
z-index:-2;
animation:glitchBottom 2s infinite linear;
}

@keyframes glitchTop{
0%{clip-path:inset(0 0 80% 0);transform:translate(-2px,-2px);}
50%{clip-path:inset(0 0 30% 0);transform:translate(2px,2px);}
100%{clip-path:inset(0 0 80% 0);}
}

@keyframes glitchBottom{
0%{clip-path:inset(80% 0 0 0);transform:translate(2px,2px);}
50%{clip-path:inset(30% 0 0 0);transform:translate(-2px,-2px);}
100%{clip-path:inset(80% 0 0 0);}
}

/* MOD */

.mod-card{
background:#002200;
padding:15px;
border-radius:12px;
}

</style>

</head>

<body>

<canvas id="matrix"></canvas>

<div id="boot">
<div id="boot-text"></div>
</div>

<div class="wrapper">
<div class="card">

<!-- AVATAR -->

<div id="discord-box">
<img id="discord-avatar" class="avatar" src="assets/avatar.png">
<div id="status-dot"></div>
</div>

<!-- GLITCH NAME -->

<h1 id="typing" class="glitch" data-text="Lamyrent"></h1>

<!-- ABOUT -->

<div class="section">
<h2>About Me</h2>
<p>
I'm Lamyrent — a developer focused on Minecraft modding (wibecoding), plugins, and creative projects.
Love MacePVP, and making content
</p>
</div>

<!-- LINKS -->

<div class="section links">
<a href="https://github.com/MrLamyrent">GitHub</a>
<a href="#">Discord</a>
<a href="#">Telegram</a>
<a href="#">Steam</a>
</div>

<!-- YOUTUBE -->

<div class="section">
<h2>YouTube</h2>
<iframe width="100%" height="350"
src="https://youtu.be/-NzVHab6Mjk?si=3Nw7_AbX0C4f0jQe"
frameborder="0"
allowfullscreen></iframe>
</div>

<!-- MOD -->

<div class="section">
<h2>My Plugin</h2>
<div id="modrinth" class="mod-card">loading...</div>
</div>

<!-- VISITS -->

<div class="section">
<h2>Visitors</h2>
<p id="visits">loading...</p>
</div>

</div>
</div>

<script>

/* NAME (для glitch) */
document.getElementById("typing").innerText="Lamyrent";

/* BOOT */

const bootLines=["Booting...","Loading...","Connecting...","Auth...","Welcome User."];
let b=0;

(function boot(){
if(b<bootLines.length){
document.getElementById("boot-text").innerHTML+=bootLines[b++]+"<br>";
setTimeout(boot,600);
}else{
setTimeout(()=>boot=document.getElementById("boot").style.display="none",800);
}
})();

/* MATRIX */

const canvas=document.getElementById("matrix");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=innerWidth;
canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

const letters="01";
const fontSize=14;
let drops=[];

function reset(){
drops=[];
for(let i=0;i<canvas.width/fontSize;i++)drops[i]=1;
}
reset();
addEventListener("resize",reset);

setInterval(()=>{
ctx.fillStyle="rgba(0,0,0,0.05)";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="#0f0";
ctx.font=fontSize+"px monospace";

drops.forEach((y,i)=>{
const text=letters[Math.floor(Math.random()*2)];
ctx.fillText(text,i*fontSize,y*fontSize);
if(y*fontSize>canvas.height&&Math.random()>0.975)drops[i]=0;
drops[i]++;
});
},33);

/* DISCORD */

fetch("https://api.lanyard.rest/v1/users/986947762132254732")
.then(r=>r.json())
.then(({data:d})=>{
const avatar=document.getElementById("discord-avatar");
avatar.src=`https://cdn.discordapp.com/avatars/${d.discord_user.id}/${d.discord_user.avatar}.png`;

const dot=document.getElementById("status-dot");
dot.className="";
dot.classList.add(d.discord_status);

const colors={
online:"#43b581",
idle:"#faa61a",
dnd:"#f04747",
offline:"#747f8d"
};

avatar.style.borderColor=colors[d.discord_status] || "#00ff88";
});

/* VISITS */

fetch("https://visitors.lamyrent.workers.dev")
.then(r=>r.json())
.then(data=>{
document.getElementById("visits").innerText=data.visits+" visits";
})
.catch(()=>{
document.getElementById("visits").innerText="error";
});

/* MODRINTH */

fetch("https://api.modrinth.com/v2/project/witherss")
.then(r=>r.json())
.then(mod=>{
document.getElementById("modrinth").innerHTML=`
<h3>${mod.title}</h3>
<p>${mod.description}</p>
<a href="https://modrinth.com/mod/${mod.slug}" target="_blank">Open →</a>
`;
});

</script>

</body>
</html>

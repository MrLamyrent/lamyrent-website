<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lamyrent</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:"JetBrains Mono",monospace;
overflow-x:hidden;
background:#001100;
color:#00ff88;
text-shadow:0 0 6px #00ff88;
}

/* CURSOR GLOW */
body::before{
content:"";
position:fixed;
width:300px;
height:300px;
border-radius:50%;
pointer-events:none;
background:radial-gradient(circle,#00ff8855,transparent 70%);
transform:translate(-50%,-50%);
z-index:-1;
}

/* CRT */
body::after{
content:"";
position:fixed;
width:100%;
height:100%;
pointer-events:none;
background:repeating-linear-gradient(
to bottom,
transparent 0px,
transparent 2px,
rgba(0,0,0,.25) 3px
);
animation:flicker .15s infinite;
}

@keyframes flicker{
0%{opacity:.96;}
50%{opacity:1;}
100%{opacity:.95;}
}

/* MATRIX */
canvas{
position:fixed;
top:0;
left:0;
z-index:-2;
}

/* BOOT */
#boot{
position:fixed;
width:100%;
height:100%;
background:black;
color:#00ff88;
padding:40px;
font-size:14px;
z-index:9999;
}

/* MAIN */
.wrapper{
display:flex;
justify-content:center;
padding:60px 20px;
}

.card{
width:760px;
background:rgba(0,20,0,.85);
border:1px solid #00ff88;
border-radius:18px;
padding:40px;
box-shadow:0 0 40px rgba(0,0,0,.8);
transition:.4s;
opacity:.9;
}

.card:hover{
opacity:1;
transform:scale(1.02);
box-shadow:0 0 80px rgba(0,255,136,0.35);
}

.section{margin-top:35px;}
.section h2{margin-bottom:12px;color:#88ffcc;font-size:15px;}

/* HEADER FLEX */
.header{
display:flex;
align-items:center;
gap:25px;
}

/* AVATAR */
#discord-box{position:relative;}

.avatar{
width:110px;
border-radius:50%;
border:3px solid #00ff88;
}

#status-dot{
position:absolute;
bottom:2px;
right:2px;
width:22px;
height:22px;
border-radius:50%;
border:3px solid #001100;
}

.online{background:#43b581;}
.offline{background:#747f8d;}
.idle{background:#faa61a;}
.dnd{background:#f04747;}

/* ACTIVITY */
.activity{
font-size:13px;
opacity:.85;
}

/* LINKS */
.links a{
display:inline-block;
margin:5px;
padding:10px 14px;
text-decoration:none;
color:#00ff88;
background:#002200;
border-radius:8px;
transition:.25s;
}

.links a:hover{
transform:translateY(-3px) scale(1.05);
background:#003300;
box-shadow:0 0 12px #00ff88;
}

/* PLUGIN */
.plugin-wrapper{
display:flex;
align-items:center;
gap:20px;
}

.plugin-avatar{
width:90px;
height:90px;
border-radius:14px;
border:2px solid #00ff88;
box-shadow:0 0 12px #00ff88;
transition:.3s;
}

.plugin-avatar:hover{
transform:scale(1.08);
box-shadow:0 0 20px #00ff88;
}

.mod-card{
background:#002200;
padding:15px;
border-radius:12px;
}

/* GLITCH */
.glitch{
position:relative;
font-weight:600;
}

.glitch::before,
.glitch::after{
content:attr(data-text);
position:absolute;
left:0;
width:100%;
}

.glitch::before{
color:#ff00c8;
z-index:-1;
animation:glitchTop 2s infinite linear;
}

.glitch::after{
color:#00fff9;
z-index:-2;
animation:glitchBottom 2s infinite linear;
}

@keyframes glitchTop{
0%{clip-path:inset(0 0 80% 0);transform:translate(-2px,-2px);}
50%{clip-path:inset(0 0 30% 0);transform:translate(2px,2px);}
100%{clip-path:inset(0 0 80% 0);}
}

@keyframes glitchBottom{
0%{clip-path:inset(80% 0 0 0);transform:translate(2px,2px);}
50%{clip-path:inset(30% 0 0 0);transform:translate(-2px,-2px);}
100%{clip-path:inset(80% 0 0 0);}
}

</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div id="boot"><div id="boot-text"></div></div>

<div class="wrapper">
<div class="card">

<!-- HEADER -->
<div class="header">

<div id="discord-box">
<img id="discord-avatar" class="avatar" src="assets/avatar.png">
<div id="status-dot"></div>
</div>

<div>
<h1 id="typing" class="glitch" data-text="Lamyrent"></h1>
<div id="activity" class="activity">Loading activity...</div>
</div>

</div>

<!-- ABOUT -->
<div class="section">
<h2>About Me</h2>
<p>I'm Lamyrent — a developer focused on Minecraft modding, plugins, and creative projects.</p>
</div>

<!-- LINKS -->
<div class="section links">

<!-- ВСТАВЬ СВОЙ GITHUB -->
<a href="https://github.com/MrLamyrent" target="_blank">GitHub</a>

<!-- пример: https://discord.gg/... -->
<a href="PASTE_DISCORD_LINK" target="_blank">Discord</a>

<!-- пример: https://t.me/... -->
<a href="PASTE_TELEGRAM_LINK" target="_blank">Telegram</a>

<!-- пример: https://steamcommunity.com/id/... -->
<a href="PASTE_STEAM_LINK" target="_blank">Steam</a>

</div>

<!-- YOUTUBE -->
<div class="section">
<h2>YouTube</h2>
<iframe width="100%" height="350"
src="https://www.youtube.com/embed/b1aWgic5keM"
frameborder="0"
allowfullscreen></iframe>
</div>

<!-- PLUGIN -->
<div class="section">
<h2>My Plugin</h2>

<div class="plugin-wrapper">
<img src="assets/avatar-paper.png" class="plugin-avatar">
<div id="modrinth" class="mod-card">loading...</div>
</div>

</div>

<!-- VISITS -->
<div class="section">
<h2>Visitors</h2>
<p id="visits">loading...</p>
</div>

</div>
</div>

<script>

/* NAME */
document.getElementById("typing").innerText="Lamyrent";

/* CURSOR GLOW */
document.addEventListener("mousemove",e=>{
document.body.style.setProperty("--x",e.clientX+"px");
document.body.style.setProperty("--y",e.clientY+"px");
document.body.style.setProperty("background-position",`${e.clientX}px ${e.clientY}px`);
document.body.style.setProperty("--mouse-x",e.clientX+"px");
document.body.style.setProperty("--mouse-y",e.clientY+"px");

document.body.querySelector("body::before");
});

/* BOOT TERMINAL */
const bootLines=[
"booting kernel...",
"injecting shaders...",
"loading modules...",
"connecting to discord api...",
"starting lamyrent.sys",
"access granted."
];

let b=0;
(function boot(){
if(b<bootLines.length){
bootText.innerHTML+=bootLines[b++]+"<br>";
setTimeout(boot,500);
}else{
setTimeout(()=>boot.style.display="none",800);
}
})();

/* MATRIX */
const canvas=document.getElementById("matrix");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=innerWidth;
canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

const letters="01";
const fontSize=14;
let drops=[];

function reset(){
drops=[];
for(let i=0;i<canvas.width/fontSize;i++)drops[i]=1;
}
reset();
addEventListener("resize",reset);

setInterval(()=>{
ctx.fillStyle="rgba(0,0,0,0.05)";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="#0f0";
ctx.font=fontSize+"px monospace;

drops.forEach((y,i)=>{
const text=letters[Math.floor(Math.random()*2)];
ctx.fillText(text,i*fontSize,y*fontSize);
if(y*fontSize>canvas.height&&Math.random()>0.975)drops[i]=0;
drops[i]++;
});
},33);

/* DISCORD + ACTIVITY */
fetch("https://api.lanyard.rest/v1/users/986947762132254732")
.then(r=>r.json())
.then(({data:d})=>{

const avatar=document.getElementById("discord-avatar");
avatar.src=`https://cdn.discordapp.com/avatars/${d.discord_user.id}/${d.discord_user.avatar}.png`;

const dot=document.getElementById("status-dot");
dot.className=d.discord_status;

const act=document.getElementById("activity");

if(d.listening_to_spotify){
act.innerText=`Listening: ${d.spotify.song} — ${d.spotify.artist}`;
}else if(d.activities.length>0){
act.innerText=`${d.activities[0].name}`;
}else{
act.innerText="Idle";
}

});

/* VISITS */
fetch("https://visitors.lamyrent.workers.dev")
.then(r=>r.json())
.then(data=>{
visits.innerText=data.visits+" visits";
})
.catch(()=>visits.innerText="error");

/* MODRINTH */
fetch("https://api.modrinth.com/v2/project/witherss")
.then(r=>r.json())
.then(mod=>{
modrinth.innerHTML=`
<h3>${mod.title}</h3>
<p>${mod.description}</p>
<a href="https://modrinth.com/mod/${mod.slug}" target="_blank">Open →</a>
`;
});

</script>

</body>
</html>
